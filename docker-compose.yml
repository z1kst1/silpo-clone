services:
  # 1. КОНТЕЙНЕР БАЗИ ДАНИХ
  db:
    image: postgres:15-alpine
    container_name: silpo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Зовнішній порт змінено з 5432, щоб не конфліктувати з локальним postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - silpo-network

  # 2. КОНТЕЙНЕР БЕКЕНДУ
  backend:
    build:
      context: ./backend
    container_name: silpo_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    # Видалено volume binding — source-код і node_modules вже в образі (через Dockerfile)
    networks:
      - silpo-network

  # 2.5. СЕРВІС АВТОМАТИЧНОГО БЕКАПУ БАЗИ ДАНИХ
  db-backup:
    image: postgres:15-alpine
    container_name: silpo_db_backup
    restart: always
    depends_on:
      - db
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # Скільки днів зберігати бекапи
      RETENTION_DAYS: 7
    volumes:
      - ./backups:/backups
    networks:
      - silpo-network
    entrypoint:
      - sh
      - -c
      - |
        echo "Backup service started. Dumping every 24h, keeping $${RETENTION_DAYS} days."
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          FILE="/backups/silpo_db_$${TIMESTAMP}.dump"
          echo "[$$(date)] Creating backup: $${FILE}"
          pg_dump -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -F c -f "$${FILE}" \
            && echo "[$$(date)] Backup OK" \
            || echo "[$$(date)] Backup FAILED"
          find /backups -name "silpo_db_*.dump" -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done

  # 3. КОНТЕЙНЕР ФРОНТЕНДУ
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: silpo_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Видалено volume binding — source-код і node_modules вже в образі (через Dockerfile)
    networks:
      - silpo-network

volumes:
  postgres_data:

networks:
  silpo-network:
    driver: bridge
