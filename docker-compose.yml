services:
  # 1. КОНТЕЙНЕР БАЗИ ДАНИХ
  db:
    image: postgres:15-alpine
    container_name: silpo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Зовнішній порт змінено з 5432, щоб не конфліктувати з локальним postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - silpo-network

  # 2. КОНТЕЙНЕР БЕКЕНДУ
  backend:
    build:
      context: ./backend
    container_name: silpo_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    # Видалено volume binding — source-код і node_modules вже в образі (через Dockerfile)
    networks:
      - silpo-network

  # 3. КОНТЕЙНЕР ФРОНТЕНДУ
  frontend:
    build:
      context: ./frontend
    container_name: silpo_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Видалено volume binding — source-код і node_modules вже в образі (через Dockerfile)
    networks:
      - silpo-network

volumes:
  postgres_data:

networks:
  silpo-network:
    driver: bridge
