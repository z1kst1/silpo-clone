<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silpo Clone</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">Silpo</div>

      <nav class="nav">
        <a href="#">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="#">Акції</a>
        <a href="#">Доставка</a>
      </nav>

      <div class="search">
        <input type="text" placeholder="Пошук товарів..." />
      </div>

      <div class="user-actions">
        <a href="login.html">
          <button>Увійти</button>
        </a>

        <a href="register.html">
          <button>Реєстрація</button>
        </a>

        <a href="cart.html">
          <button>Кошик</button>
        </a>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <h1>Ласкаво просимо до Silpo</h1>
      <p>Найкращі продукти онлайн</p>
      <a href="catalog.html">
        <button>Перейти до каталогу</button>
      </a>
    </section>

    <!-- CATEGORIES -->
    <section class="categories">
      <h2>Категорії</h2>
      <div class="category-list">
        <div class="category-card">Фрукти</div>
        <div class="category-card">Овочі</div>
        <div class="category-card">М'ясо</div>
        <div class="category-card">Молочні продукти</div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="products">
      <h2>Популярні товари</h2>

      <div class="product-grid">
        <div class="product-card">
          <img src="images/product1.jpg" alt="Яблука" />
          <h3>Яблука</h3>
          <p>25 грн</p>
          <button onclick="addToCart('Яблука')">Додати в кошик</button>
        </div>

        <div class="product-card">
          <img src="images/product2.jpg" alt="Молоко" />
          <h3>Молоко</h3>
          <p>32 грн</p>
          <button onclick="addToCart('Молоко')">Додати в кошик</button>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Silpo Clone | Навчальний проєкт</p>
    </footer>

    <script src="js/cart.js"></script>
  </body>
</html>
